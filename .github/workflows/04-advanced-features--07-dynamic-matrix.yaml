name: 0407-Dynamic Matrix
on:
  workflow_dispatch:
    inputs:
      length:
        description: "Number of foo/bar pairs to generate"
        required: true
        default: "2"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - name: Generate paired list (foo = random, bar = random)
        id: gen
        env:
          LENGTH: ${{ github.event.inputs.length }}
        shell: bash
        run: |
          set -euo pipefail

          n="${LENGTH:-2}"

          # 一般来说，我会把这类逻辑抽取到一个单独的
          # Taskfile task 中，方便迭代／验证
          include_json=$(
            {
              for ((i=1; i<=n; i++)); do
                foo_val=$((RANDOM % 100))
                bar_val=$((RANDOM % 100))
                jq -n -c \
                  --argjson foo "$foo_val" \
                  --argjson bar "$bar_val" \
                  '{foo:$foo, bar:$bar}'
              done
            } | jq -s -c .
          )

          # 输出该数组，供 `matrix.include` 使用
          echo "include=$include_json" >> "$GITHUB_OUTPUT"

  execute:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.include) }}
    steps:
      - name: Use matrix values (paired randoms)
        run: echo "Matrix - foo=${{ matrix.foo }}, bar=${{ matrix.bar }}"
