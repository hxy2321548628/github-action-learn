name: 0404-Permissions
on:
  workflow_dispatch:

# 权限既可以在 workflow 级别定义，也可以在 job 级别定义
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token

################
# 默认权限
################
# permissions:
#   contents: read
#   packages: read
################

################
# 所有权限类型
################
# permissions:
#   控制对 Actions 相关资源(workflow run、artifact、cache、secret 等)的访问。
#   actions: read|write|none 

#   管理 artifact attestations(供应链安全里证明"这个包确实是这个仓库构建的"的签名记录)。
#   attestations: read|write|none

#   对应 PR 上的 Checks 标签页(check runs、check suites)。
#   checks: read|write|none

#   控制仓库里的文件、commit、branch、tag、release。
#   contents: read|write|none

#   GitHub 的 Deployments API(部署记录、环境、部署状态)。
#   deployments: read|write|none

#   OIDC 令牌 ⭐ 无 read,只有 write/none
#   id-token: write|none

#   控制仓库的 Issues。
#   issues: read|write|none

#   访问 GitHub Models(GitHub 托管的 AI 模型推理 API)。
#   models: read|none

#   控制仓库的 Discussions(类似论坛的板块)。
#   discussions: read|write|none

#   控制 GitHub Packages(npm/Maven/Docker 等制品仓)。
#   packages: read|write|none

#   控制 GitHub Pages(静态站点,如项目文档站)。
#   pages: read|write|none

#   控制 Pull Requests。
#   pull-requests: read|write|none

#   控制 Code Scanning / 安全告警。
#   security-events: read|write|none

#   控制 commit statuses(PR 上那些 ✅❌ 的旧式状态)。
#   statuses: read|write|none
################

jobs:
  read-only-pr:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read # 只能读取 PR 数据
    continue-on-error: true # 避免整个 workflow 失败
    steps:
      # 把当前仓库的代码下载(clone)到 runner 的工作目录里。
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0

      - name: List the first 5 open PRs (allowed)
        run: gh pr list --limit 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt to add a label (expected to fail)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit 1 --add-label "documentation"

      - name: Confirm the failure
        if: failure()
        run: echo "❌  Write operation was blocked as expected – token is read-only."

  read-write-pr:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@ff7abcd0c3c05ccf6adc123a8cd1fd4fb30fb493 # v5.0.0

      - name: Attempt to add a label (expected to succeed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit 1 --add-label "documentation"
      - name: Confirm the
        if: success()
        run: echo "✅ Write operation succeeded!"
